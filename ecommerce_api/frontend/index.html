<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi E-commerce de Remeras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --violeta-oscuro: #311042;
            --violeta-principal: #6f42c1;
            --violeta-claro: #f3e8ff;
        }
        
        /* Barra de navegación personalizada */
        .bg-violeta-nav {
            background-color: var(--violeta-oscuro) !important;
        }
        
        /* Botones principales */
        .btn-violeta {
            background-color: var(--violeta-principal);
            color: white;
            border: none;
            transition: background 0.3s ease;
        }
        .btn-violeta:hover {
            background-color: #5a32a3;
            color: white;
        }
        
        /* Contador del carrito */
        .badge-violeta {
            background-color: var(--violeta-principal) !important;
        }
        
        /* Tarjetas de productos */
        .card-producto {
            border: 1px solid var(--violeta-claro);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-producto:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(111, 66, 193, 0.1) !important;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-violeta-nav mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">👕 Remeras Shop</a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light px-4 rounded-pill" id="btn-login" data-bs-toggle="modal" data-bs-target="#loginModal">
                    👤 Iniciar Sesión
                </button>
                <button class="btn btn-outline-light position-relative px-4 rounded-pill" id="btn-carrito">
                    🛒 Carrito
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="carrito-contador">
                        0
                    </span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mb-5 fw-bold" style="color: var(--violeta-oscuro);">Nuestra Colección</h1>
        
        <div class="row row-cols-1 row-cols-md-3 g-4" id="contenedor-productos">
            </div>
    </div>
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
                <div class="modal-header bg-violeta-nav text-white" style="border-top-left-radius: 15px; border-top-right-radius: 15px;">
                    <h5 class="modal-title fw-bold" id="loginModalLabel">🔐 Iniciar Sesión</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
                    <form id="form-login">
                        <div class="mb-3">
                            <label for="login-username" class="form-label fw-bold" style="color: var(--violeta-oscuro);">Usuario</label>
                            <input type="text" class="form-control" id="login-username" required placeholder="Tu nombre de usuario">
                        </div>
                        <div class="mb-3">
                            <label for="login-password" class="form-label fw-bold" style="color: var(--violeta-oscuro);">Contraseña</label>
                            <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-violeta w-100 py-2 rounded-pill fw-bold mt-2">Ingresar a la Tienda</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
